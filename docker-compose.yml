version: '3.8'

services:
  kong-database:
    image: postgres:13
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [kong-network]

  wait-for-db:
    image: postgres:13
    command: >
      sh -c 'until pg_isready -h kong-database -p 5432 -U kong -d kong; do
               echo "waiting postgres..."; sleep 2;
             done'
    depends_on:
      kong-database:
        condition: service_healthy
    networks: [kong-network]

  kong-migration:
    image: kong:3.6
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PG_TIMEOUT: 120000
      KONG_LOG_LEVEL: debug
    command: "sh -c 'kong migrations bootstrap --vv'"
    depends_on:
      wait-for-db:
        condition: service_completed_successfully
    networks: [kong-network]
    restart: on-failure

  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PG_TIMEOUT: 120000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
      - "8002:8002"
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [kong-network]

  api-app:
    build: .
    networks: [kong-network]
    ports:
      - "8080:8080"
      - "8081:8081"
      - "50051:50051"
    command: python -u main.py
    depends_on:
      kong:
        condition: service_healthy

volumes:
  kong_data:

networks:
  kong-network:
    driver: bridge